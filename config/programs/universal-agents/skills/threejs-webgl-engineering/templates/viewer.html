<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive 3D Model Inspector</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #overlay { position: absolute; top: 16px; left: 16px; color: #f8fafc; pointer-events: none; z-index: 10; }
    #overlay h1 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
    #overlay p { margin: 0; font-size: 12px; color: #94a3b8; }
    #dropzone { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border: 1px dashed #38bdf8; border-radius: 8px; padding: 12px 24px; color: #e2e8f0; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>3D Viewport Inspector</h1>
    <p>Orbit: Left Click | Pan: Right Click | Zoom: Scroll</p>
  </div>
  <div id="dropzone">Drop any .glb or .gltf file here to inspect</div>
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.170.0';
    import { OrbitControls } from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 2.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 20, 0x38bdf8, 0x334155);
    scene.add(grid);

    // Default Demo Geometry
    const defaultGeo = new THREE.TorusKnotGeometry(0.8, 0.28, 100, 16);
    const defaultMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8 });
    let currentMesh = new THREE.Mesh(defaultGeo, defaultMat);
    currentMesh.castShadow = true;
    currentMesh.position.y = 1.2;
    scene.add(currentMesh);

    // Drag and Drop GLTF Loader
    const loader = new GLTFLoader();
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loader.parse(event.target.result, '', (gltf) => {
          if (currentMesh) scene.remove(currentMesh);
          currentMesh = gltf.scene;
          
          const box = new THREE.Box3().setFromObject(currentMesh);
          const center = box.getCenter(new THREE.Vector3());
          currentMesh.position.sub(center);
          currentMesh.position.y += (box.max.y - box.min.y) / 2;
          
          scene.add(currentMesh);
          document.getElementById('dropzone').innerText = `Loaded: ${file.name}`;
        });
      };
      reader.readAsArrayBuffer(file);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
