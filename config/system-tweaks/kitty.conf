# Kitty config for Claude Code (created 2026-10-17)
font_family      MesloLGM Nerd Font Mono
font_size        11.0
# the statusline uses emoji; fall back to the colour emoji font
symbol_map U+1F300-U+1FAFF Noto Color Emoji
scrollback_lines 20000
enable_audio_bell no
window_padding_width 6
confirm_os_window_close 0
copy_on_select clipboard
# kitty keyboard protocol is on by default: gives Claude Code real key press/release (push-to-talk F9) and Shift+Enter for newline
# Ctrl+V: screenshots (images) AND text both work; Ctrl+Shift+V always pastes plain text
map ctrl+v kitten smart_paste.py
map ctrl+shift+v paste_from_clipboard
# smart_paste.py: Ctrl+V sends a screenshot/image from the clipboard to Claude Code as Ctrl+V (it reads the image itself), plain text is pasted as text
