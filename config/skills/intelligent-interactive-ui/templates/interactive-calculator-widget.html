<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive ROI & Quota Calculator</title>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#09090b] text-neutral-200 min-h-screen flex items-center justify-center p-6 selection:bg-neutral-800 selection:text-white"
      x-data="calculatorState()">

  <div class="max-w-2xl w-full bg-[#121215] border border-neutral-800 rounded-2xl p-8 shadow-2xl space-y-8">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-neutral-800/80 pb-6">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full border border-neutral-800 bg-neutral-900/60 text-xs font-medium text-neutral-400 mb-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Intelligent Interactive UI
        </div>
        <h1 class="text-xl font-semibold text-white tracking-tight">AI Engineering Quota & ROI Calculator</h1>
      </div>
      <button @click="resetDefaults()" class="text-xs text-neutral-500 hover:text-neutral-300 transition-colors">
        Reset Defaults
      </button>
    </div>

    <!-- Sliders & Inputs -->
    <div class="space-y-6">
      <!-- Input 1: Developers -->
      <div>
        <div class="flex justify-between text-sm mb-2">
          <label class="text-neutral-400">Engineering Team Size</label>
          <span class="mono font-medium text-white" x-text="devs + ' Engineers'"></span>
        </div>
        <input type="range" min="1" max="50" step="1" x-model.number="devs" 
               class="w-full h-2 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-white">
      </div>

      <!-- Input 2: Turns per Day -->
      <div>
        <div class="flex justify-between text-sm mb-2">
          <label class="text-neutral-400">Average Daily Prompts per Engineer</label>
          <span class="mono font-medium text-white" x-text="promptsPerDay + ' Prompts/day'"></span>
        </div>
        <input type="range" min="10" max="200" step="5" x-model.number="promptsPerDay" 
               class="w-full h-2 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-white">
      </div>

      <!-- Input 3: Optimization Tier Toggle -->
      <div>
        <label class="block text-sm text-neutral-400 mb-2">CLI Optimization Setup</label>
        <div class="grid grid-cols-2 gap-3">
          <button @click="optLevel = 'unoptimized'" 
                  :class="optLevel === 'unoptimized' ? 'border-neutral-500 bg-neutral-800/60 text-white' : 'border-neutral-800 bg-neutral-900/40 text-neutral-400 hover:border-neutral-700'"
                  class="p-3 rounded-xl border text-sm font-medium transition-all text-left">
            <div>Standard Unoptimized</div>
            <div class="text-xs text-neutral-500 mt-0.5">Full chat prose & verbose logs</div>
          </button>
          <button @click="optLevel = 'optimized'" 
                  :class="optLevel === 'optimized' ? 'border-emerald-500/50 bg-emerald-950/20 text-emerald-300' : 'border-neutral-800 bg-neutral-900/40 text-neutral-400 hover:border-neutral-700'"
                  class="p-3 rounded-xl border text-sm font-medium transition-all text-left">
            <div class="flex items-center gap-1.5">
              <span>CLI Power Setup</span>
              <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.2 rounded font-mono">77 Skills</span>
            </div>
            <div class="text-xs text-neutral-500 mt-0.5">Token Economy + Prompt Caching</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Calculated Results Bento Box -->
    <div class="grid grid-cols-2 gap-4 bg-neutral-900/40 border border-neutral-800/80 rounded-xl p-5">
      <div>
        <div class="text-xs text-neutral-500 mb-1">Monthly Token Consumption</div>
        <div class="text-2xl font-bold mono text-white tracking-tight" x-text="formatNumber(monthlyTokens) + ' tok'"></div>
        <div class="text-xs text-neutral-400 mt-1" x-text="optLevel === 'optimized' ? '📉 75% savings via prompt cache' : 'Standard API/Pro rate'"></div>
      </div>
      <div>
        <div class="text-xs text-neutral-500 mb-1">Estimated Monthly Cost</div>
        <div class="text-2xl font-bold mono" :class="optLevel === 'optimized' ? 'text-emerald-400' : 'text-amber-400'" x-text="'$' + formatCurrency(monthlyCost)"></div>
        <div class="text-xs text-emerald-500 mt-1" x-text="optLevel === 'optimized' ? 'Saved: $' + formatCurrency(savings) + '/mo' : 'No cache discounts applied'"></div>
      </div>
    </div>

    <!-- Action Toolbar -->
    <div class="flex items-center justify-between pt-2">
      <div class="text-xs text-neutral-500">
        Live reactive state via Alpine.js • Zero build required
      </div>
      <div class="flex items-center gap-2">
        <button @click="exportCSV()" class="px-3 py-1.5 rounded-lg border border-neutral-800 bg-neutral-900 hover:bg-neutral-800 text-xs font-medium text-neutral-300 transition-colors">
          Export CSV
        </button>
        <button @click="exportJSON()" class="px-3 py-1.5 rounded-lg bg-white text-black hover:bg-neutral-200 text-xs font-medium transition-colors">
          Export JSON
        </button>
      </div>
    </div>

  </div>

  <script>
    function calculatorState() {
      return {
        devs: 3,
        promptsPerDay: 40,
        optLevel: 'optimized',

        get monthlyTokens() {
          const basePerPrompt = this.optLevel === 'optimized' ? 1200 : 5500;
          return this.devs * this.promptsPerDay * basePerPrompt * 22; // 22 working days
        },

        get monthlyCost() {
          const costPerMTok = this.optLevel === 'optimized' ? 0.65 : 4.50;
          return (this.monthlyTokens / 1000000) * costPerMTok;
        },

        get savings() {
          const unoptimizedMonthly = this.devs * this.promptsPerDay * 5500 * 22;
          const unoptimizedCost = (unoptimizedMonthly / 1000000) * 4.50;
          return Math.max(0, unoptimizedCost - this.monthlyCost);
        },

        resetDefaults() {
          this.devs = 3;
          this.promptsPerDay = 40;
          this.optLevel = 'optimized';
        },

        formatNumber(n) {
          if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
          if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
          return n.toString();
        },

        formatCurrency(n) {
          return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        exportJSON() {
          const data = {
            teamSize: this.devs,
            dailyPrompts: this.promptsPerDay,
            mode: this.optLevel,
            monthlyTokens: this.monthlyTokens,
            monthlyCostUSD: this.monthlyCost,
            monthlySavingsUSD: this.savings
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'ai-quota-roi-model.json';
          a.click();
        },

        exportCSV() {
          const rows = [
            ["Metric", "Value"],
            ["Engineering Team Size", this.devs],
            ["Daily Prompts per Engineer", this.promptsPerDay],
            ["Optimization Mode", this.optLevel],
            ["Monthly Tokens", this.monthlyTokens],
            ["Monthly Cost USD", this.monthlyCost.toFixed(2)],
            ["Monthly Savings USD", this.savings.toFixed(2)]
          ];
          const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
          const encodedUri = encodeURI(csvContent);
          const a = document.createElement('a');
          a.href = encodedUri;
          a.download = 'ai-quota-roi-model.csv';
          a.click();
        }
      }
    }
  </script>
</body>
</html>
